<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Microtech AI · Acceso MC</title>
<style>html{color-scheme:dark;font:16px system-ui;background:#050810;color:#c8ddff}body{min-height:95vh;display:grid;place-items:center;margin:0}main{width:min(340px,85vw);padding:32px;border:1px solid #254462;border-radius:16px;background:#091323}h1{color:#70c6ff;letter-spacing:.18em}label{display:block;margin:18px 0}input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #355977;border-radius:8px;background:#0b1d30;color:inherit}input{margin-top:7px}button{cursor:pointer;background:#12395a}button:disabled{opacity:.5}#status{min-height:3em;font-size:.9em}small{color:#91a5bf}</style></head>
<body><main><h1>Microtech AI</h1><p>Acceso único · cuenta MC</p><form id="access"><label>Usuario<input name="username" autocomplete="username" required maxlength="128"></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required maxlength="512"></label><button id="submit" disabled>Acceder</button></form><p id="status" role="status" aria-live="polite">Preparando acceso seguro…</p><button id="retry" hidden>Reintentar conexión</button><small>MIA · Una sesión para el dashboard y el chat.</small><noscript>Activa JavaScript para iniciar sesión.</noscript></main>
<script>
(() => {
  'use strict';
  const form=document.getElementById('access'), button=document.getElementById('submit'), status=document.getElementById('status'), retry=document.getElementById('retry');
  let csrf='', busy=false;
  async function api(action,body) {
    const r=await fetch('/api/chat.php?action='+action,{method:body===undefined?'GET':'POST',credentials:'same-origin',cache:'no-store',headers:body===undefined?{}:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body===undefined?undefined:JSON.stringify(body)});
    const data=await r.json(); if(!r.ok) throw new Error(data.error||'No se pudo conectar.'); return data;
  }
  async function prepare() {
    button.disabled=true; retry.hidden=true;
    try { const data=await api('session'); if(data.authenticated===true){location.replace('/');return;} if(typeof data.csrf!=='string'||!data.csrf)throw new Error('No se pudo preparar la sesión.'); csrf=data.csrf; button.disabled=false; status.textContent='Introduce tu cuenta MC.'; }
    catch(e){status.textContent=e.message;retry.hidden=false;}
  }
  form.addEventListener('submit',async e=>{
    e.preventDefault(); if(busy||!csrf)return; busy=true; button.disabled=true;
    const body={username:form.elements.username.value.trim(),password:form.elements.password.value}; form.elements.password.value='';
    try {const data=await api('login',body);if(data.authenticated!==true)throw new Error('No se pudo iniciar sesión.');location.replace('/');}
    catch(e){status.textContent=e.message;}
    finally{body.password='';busy=false;button.disabled=false;}
  });
  retry.addEventListener('click',prepare); prepare();
})();
</script></body></html>
