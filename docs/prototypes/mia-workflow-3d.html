<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIA · Workflow 3D prototype</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#050a11;color:#dcecff;--line:#27435d;--muted:#91a9bf;--teal:#55d8db;--blue:#80bfff}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:radial-gradient(circle at 50% 44%,#16334a 0,#07101a 45%,#03060b 100%)}button,select{font:inherit;color:inherit;background:#0e1c2b;border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-height:40px}button{cursor:pointer}button:hover,button:focus-visible,select:focus-visible{border-color:var(--teal);outline:2px solid #72e8e966;outline-offset:2px}.shell{position:relative;height:100svh}.hud{position:absolute;z-index:5;top:18px;left:22px;right:22px;display:flex;align-items:center;gap:16px;pointer-events:none}.brand{font-size:12px;letter-spacing:.2em;color:#bceeff;font-weight:700}.subtitle{color:var(--muted);font-size:12px}.controls{position:absolute;z-index:6;right:22px;top:60px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.readout{position:absolute;z-index:5;left:22px;bottom:18px;color:#7892aa;font:11px ui-monospace,monospace}.nodes{position:absolute;z-index:6;left:22px;top:70px;bottom:52px;width:228px;display:flex;flex-direction:column;gap:6px;overflow:auto;padding-right:4px}.nodes h2{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7295b1;margin:0 0 5px}.node-button{text-align:left;background:#091522cc;border-color:#223d54;padding:9px 10px;min-height:48px}.node-button[aria-current=true]{background:#123949dd;border-color:var(--teal);box-shadow:0 0 18px #3edfe533}.node-button small{display:block;color:#86a1b7;font-size:10px;margin-top:3px}.status{position:absolute;z-index:5;right:22px;bottom:18px;max-width:320px;color:#9db5c9;font-size:12px;text-align:right}.status strong{color:var(--teal)}canvas{display:block;width:100%;height:100%}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:720px){.hud{left:14px;right:14px;top:12px;display:block}.subtitle{display:block;margin-top:5px}.controls{top:auto;bottom:58px;right:14px;left:14px;justify-content:center}.nodes{left:14px;right:14px;top:auto;bottom:112px;width:auto;height:116px;flex-direction:row;overflow-x:auto;overflow-y:hidden}.nodes h2{display:none}.node-button{min-width:138px}.status{right:14px;bottom:14px;max-width:190px;font-size:10px}.readout{left:14px;bottom:14px;font-size:9px}}
</style>
</head>
<body>
<div class="shell">
<header class="hud"><div class="brand">MICROTECH AI / MIA</div><div class="subtitle">Mapa vivo del workflow · prototipo aislado</div></header>
<div class="controls"><button id="home" type="button">Volver al núcleo</button><label class="sr" for="demo">Estado demo</label><select id="demo" aria-label="Estado visual de demostración"><option value="available">Estados reales disponibles</option><option value="draft">Idea · BORRADOR</option><option value="confirm">Requiere confirmación</option><option value="blocked">Bloqueado</option></select></div>
<nav class="nodes" aria-label="Workflow Microtech AI"><h2>Workflow</h2></nav>
<div id="status" class="status" role="status" aria-live="polite"><strong>Núcleo MIA</strong><br>Selecciona una etapa para viajar por el flujo.</div>
<div id="readout" class="readout">prototype · renderer pendiente</div>
<div id="announce" class="sr" role="status" aria-live="polite"></div>
</div>
<script>
'use strict';
// PROTOTYPE ONLY: isolated Three.js scene. No backend, auth, model or MC writes.
const stages=[
 {id:'idea',label:'IDEA',desc:'Captura y borrador',pos:[-5,2,0]},
 {id:'analysis',label:'ANÁLISIS',desc:'Hechos e hipótesis',pos:[-6,6,0]},
 {id:'proposal',label:'PROPUESTA',desc:'Alcance y entregables',pos:[-2,8,0]},
 {id:'client',label:'CLIENTE',desc:'Valor y próximos pasos',pos:[3,8,0]},
 {id:'project',label:'PROYECTO',desc:'Ejecución MC',pos:[7,6,0]},
 {id:'grants',label:'SUBVENCIÓN',desc:'Oportunidades y fechas',pos:[9,2,0]},
 {id:'followup',label:'SEGUIMIENTO',desc:'Hitos y auditoría',pos:[6,-2,0]}
];
const root=document.querySelector('.shell'), nav=document.querySelector('.nodes'), status=document.querySelector('#status'), announce=document.querySelector('#announce'), readout=document.querySelector('#readout');
let renderer,scene,camera,raycaster,mouse,core,nodes=[],links=[],selected=-1,targetPos=new THREE.Vector3(0,2,24),targetLook=new THREE.Vector3(0,1,0),look=new THREE.Vector3(0,1,0),moving=false,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function makeTextSprite(text,color){const c=document.createElement('canvas'),x=c.getContext('2d');c.width=512;c.height=96;x.font='700 28px system-ui';x.fillStyle=color;x.textAlign='center';x.fillText(text,256,54);const t=new THREE.CanvasTexture(c);t.needsUpdate=true;const m=new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false});const s=new THREE.Sprite(m);s.scale.set(4.8,.9,1);return s}
function curve(a,b){const mid=a.clone().lerp(b,.5);mid.y+=2;const g=new THREE.TubeGeometry(new THREE.CatmullRomCurve3([a,mid,b]),24,.035,6,false);const m=new THREE.MeshBasicMaterial({color:0x3acfd2,transparent:true,opacity:.58});const o=new THREE.Mesh(g,m);scene.add(o);links.push(o)}
function choose(i,announceIt=true){selected=i;nodes.forEach((n,j)=>{n.group.scale.setScalar(j===i?1.18:1);n.group.userData.active=j===i;nav.querySelectorAll('button')[j].setAttribute('aria-current',String(j===i));});const s=stages[i];if(i<0){targetPos.set(0,2,24);targetLook.set(0,1,0);status.innerHTML='<strong>Núcleo MIA</strong><br>Selecciona una etapa para viajar por el flujo.'}else{const p=new THREE.Vector3(...s.pos);targetPos.copy(p).add(new THREE.Vector3(p.x>0?5:-5,2,15));targetLook.copy(p);status.innerHTML='<strong>'+s.label+'</strong><br>'+s.desc+' · conectado al núcleo';if(announceIt)announce.textContent='Enfocando '+s.label+'.'}moving=true;if(reduced){camera.position.copy(targetPos);look.copy(targetLook);moving=false}}
function init(){renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;root.append(renderer.domElement);scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,1000);camera.position.copy(targetPos);raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();scene.add(new THREE.AmbientLight(0x4d7890,1.4));const light=new THREE.PointLight(0x39d7e0,12,45);light.position.set(0,3,4);scene.add(light);
 core=new THREE.Group();scene.add(core);const sphere=new THREE.Mesh(new THREE.IcosahedronGeometry(2.3,3),new THREE.MeshStandardMaterial({color:0x102c3c,metalness:.85,roughness:.23,emissive:0x0b8292,emissiveIntensity:1.2}));core.add(sphere);const ring=new THREE.Mesh(new THREE.TorusGeometry(3,.045,8,96),new THREE.MeshBasicMaterial({color:0x64e9e3,transparent:true,opacity:.8}));ring.rotation.x=.7;core.add(ring);for(let i=0;i<stages.length;i++){const s=stages[i],g=new THREE.Group();g.position.set(...s.pos);const body=new THREE.Mesh(new THREE.BoxGeometry(3.5,1.25,.35),new THREE.MeshStandardMaterial({color:0x102636,metalness:.7,roughness:.32,emissive:0x092c38,emissiveIntensity:.4}));body.userData.index=i;g.add(body);const label=makeTextSprite(s.label,'#c9f7ff');label.position.z=.35;label.position.y=.05;g.add(label);scene.add(g);nodes.push({group:g,body,label});curve(new THREE.Vector3(0,1,0),g.position);const b=document.createElement('button');b.type='button';b.className='node-button';b.innerHTML='<b>'+s.label+'</b><small>'+s.desc+'</small>';b.addEventListener('click',()=>choose(i));nav.append(b)}
 renderer.domElement.addEventListener('pointerdown',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const hit=raycaster.intersectObjects(nodes.map(n=>n.body));if(hit.length)choose(hit[0].object.userData.index)});document.querySelector('#home').addEventListener('click',()=>choose(-1));document.querySelector('#demo').addEventListener('change',e=>{status.innerHTML='<strong>Demo</strong><br>'+e.target.options[e.target.selectedIndex].text+' · sin datos reales';announce.textContent='Estado visual '+e.target.value+'.'});addEventListener('keydown',e=>{if(e.key==='Escape'){choose(-1);document.querySelector('#home').focus()}if(e.key==='Enter'&&document.activeElement.classList.contains('node-button'))document.activeElement.click()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});readout.textContent='prototype · 1 renderer · 1 RAF · 7 nodos · '+renderer.info.render.calls+' draws';animate()}
function animate(){requestAnimationFrame(animate);const k=reduced?1:.075;camera.position.lerp(targetPos,k);look.lerp(targetLook,k);camera.lookAt(look);moving=camera.position.distanceTo(targetPos)>.05;core.rotation.y+=reduced?0:.003;core.rotation.z+=reduced?0:.001;nodes.forEach((n,i)=>{n.group.rotation.y=Math.sin(performance.now()*.0005+i)*.06;n.group.position.z=Math.sin(performance.now()*.0007+i)*.22;n.body.material.emissiveIntensity=n.group.userData.active?1.4:.4});renderer.render(scene,camera);readout.textContent='prototype · 1 renderer · 1 RAF · 7 nodos · '+renderer.info.render.calls+' draws'}
init();
</script>
</body></html>
