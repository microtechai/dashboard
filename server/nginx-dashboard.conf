# Only replaces the existing dashboard TLS server block. Other vhosts unchanged.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.microtechai.es;
    ssl_certificate /etc/letsencrypt/live/microtechai.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/microtechai.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/dashboard;

    if ($host != dashboard.microtechai.es) { return 421; }
    # No inherited fastcgi/CDN cache may serve a prior authenticated response.
    fastcgi_cache off;
    fastcgi_hide_header Cache-Control;
    fastcgi_hide_header Expires;
    fastcgi_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "private, no-store, no-cache, max-age=0, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    etag off;
    if_modified_since off;

    # Public, self-contained login. Contains no dashboard data or external assets.
    location = /login.html { try_files /login.html =503; }
    # Only session/bootstrap/login/logout are public actions; private actions
    # have MC + Origin + CSRF checks in PHP. Exact match: no PATH_INFO aliases.
    location = /api/chat.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/dashboard/api/chat.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 90s;
        fastcgi_buffering off;
        fastcgi_intercept_errors off;
    }
    # Every other URL, including .php, backups, dotted paths and fallback
    # aliases, enters the server-side allowlist AFTER live MC validation.
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/jarvis-access/gate.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_intercept_errors off;
    }
}
